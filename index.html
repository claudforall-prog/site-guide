<head>

<body>
<title>오늘의 작업 안내</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Sans+Thai:wght@400;500;700;800&display=swap">
<style>
/* Layout: 그림 타일 → 영상과 O/X 그림 카드. 아래 탭에 현장 말하기. 햇빛 아래에서 잘 보이도록 밝은 단일 테마. */
:root {
  --blue: #B8430F; --ground: #FFF5E6; --surface: #FFFFFF; --ink: #3A2417; --muted: #6B5344; --chip: #F7E3C8; --honey: #FFC766; --display: "Jua", "Gothic A1", sans-serif;
  --ok: #3F5D12; --ok-bg: #EEF3D6; --no: #A8200F; --no-bg: #FFE4DC; --stage: #3A2417; --on: #FFFFFF;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html:lang(zh) { --font: "Noto Sans SC", "PingFang SC", sans-serif; }
html:lang(vi), html:lang(ru) { --font: "Noto Sans", Roboto, Arial, sans-serif; }
html:lang(th) { --font: "Noto Sans Thai", Thonburi, Tahoma, sans-serif; }
* { box-sizing: border-box; }
html, body { background: var(--ground); }
body { min-height: 100vh; min-height: 100dvh; color: var(--ink); font: 400 17px/1.45 var(--font); overflow-wrap: anywhere; }
html:lang(ko) body { word-break: keep-all; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid #FFB800; outline-offset: 2px; }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 104px; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 800; color: var(--ink); text-wrap: balance; min-width: 0; }
.hero { background: var(--honey); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: 32px; }
html:not(:lang(ko)) .hero h1 { font-family: var(--font); font-weight: 800; font-size: 27px; }
.hero p { margin: 0; font-size: 18px; font-weight: 700; }
.hero .langbtn { align-self: flex-end; }
.langbtn { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 2px solid currentColor; border-radius: 22px; font-weight: 700; font-size: 16px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; min-height: 176px; padding: 14px 10px; border-radius: 28px; box-shadow: 0 2px 0 #EFD9BC; background: var(--surface); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; font-size: 20px; font-weight: 800; line-height: 1.25; }
.tile svg { width: 96px; height: 96px; padding: 14px; border-radius: 50%; color: #7A3410; background: #FFE3B8; }
.tile:nth-child(2) svg { background: #FFD6C4; } .tile:nth-child(3) svg { background: #E7EDC4; } .tile:nth-child(4) svg { background: #FCE6A0; } .tile:nth-child(5) svg { background: #F6D8C8; } .tile:nth-child(6) svg { background: #EFE0C8; }
.tile .seen { position: absolute; top: 10px; right: 12px; font-size: 14px; color: var(--ok); }
.note { font-size: 15px; color: var(--muted); }
.note p { margin: 0 0 6px; }
.back { align-self: flex-start; min-height: 44px; font-weight: 700; }
.player { background: var(--stage); color: var(--on); border-radius: 24px; overflow: hidden; }
.screen { position: relative; aspect-ratio: 16 / 10; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 44px 14px 12px; text-align: center; }
.badge { position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 6px; font-weight: 800; font-size: 15px; background: var(--blue); }
.badge.warn { background: #C8200F; }
.sample { position: absolute; top: 14px; right: 12px; font-size: 13px; }
.art { position: relative; flex: none; width: clamp(68px, 20vw, 130px); height: clamp(68px, 20vw, 130px); animation: pop .4s ease-out both; }
.art svg { width: 100%; height: 100%; }
.art .no { position: absolute; inset: -6%; color: #FF5B47; }
.cap { margin: 0; font-size: clamp(18px, 5vw, 22px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.big { position: absolute; inset: 0; width: 100%; display: grid; place-items: center; background: rgba(58,36,23,.72); font-size: 24px; font-weight: 800; text-align: center; color: var(--on); }
.controls { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 12px 6px 6px; }
.pp { width: 52px; height: 48px; display: grid; place-items: center; }
.pp svg { width: 28px; height: 28px; fill: var(--on); }
.segs { display: flex; gap: 3px; }
.seg { flex: 1; height: 44px; display: flex; align-items: center; min-width: 0; }
.seg i { display: block; width: 100%; height: 8px; background: #7A6556; position: relative; overflow: hidden; }
.seg i b { position: absolute; inset: 0 auto 0 0; background: #FFC766; }
.seg.warn i b { background: #FF8A7A; }
.time { font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.media { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; font-weight: 700; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 20px; background: var(--chip); font-size: 15px; font-weight: 700; }
.chip.on { background: var(--blue); color: var(--on); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { width: 100%; height: 100%; min-height: 176px; padding: 12px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 16px; font-weight: 700; line-height: 1.35; background: var(--ok-bg); color: var(--ok); }
.card.warn { background: var(--no-bg); color: var(--no); }
.card.now { outline: 3px solid var(--ink); }
.card .pic { position: relative; width: 72px; height: 72px; flex: none; }
.card .pic > svg:first-child { width: 100%; height: 100%; }
.card .pic .no { position: absolute; inset: -4%; width: 108%; height: 108%; }
.card .mark { font-size: 20px; font-weight: 800; }
.phrases { display: flex; flex-direction: column; gap: 10px; }
.phrase { width: 100%; min-height: 88px; padding: 12px 16px; border-radius: 24px; background: var(--surface); display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 10px; align-items: center; text-align: left; }
.phrase.first { background: #C8200F; color: var(--on); }
.phrase strong { display: block; font-size: 20px; font-weight: 800; }
.phrase svg { width: 32px; height: 32px; color: var(--blue); }
.phrase.first svg { color: var(--on); }
.hint { margin: 0; color: var(--muted); font-size: 16px; }
.overlay { position: fixed; inset: 0; z-index: 30; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); background: var(--stage); color: var(--on); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; text-align: center; }
.overlay p { margin: 0; font-size: clamp(38px, 11vw, 64px); line-height: 1.2; font-weight: 800; }
.overlay button { min-height: 56px; padding: 0 28px; border-radius: 28px; background: var(--on); color: var(--ink); font-weight: 800; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid #EFD9BC; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { min-height: 68px; padding: 4px; font-size: 15px; line-height: 1.2; text-align: center; color: var(--muted); font-weight: 700; }
.tabs button.on { color: var(--blue); font-weight: 800; box-shadow: inset 0 3px 0 var(--blue); }
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lang { width: 100%; min-height: 72px; padding: 10px 18px; border-radius: 24px; background: var(--surface); color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang.on { outline: 3px solid var(--ink); }
.lang strong { font-size: 24px; font-weight: 800; }
.lang small { font-size: 15px; }
.hazard { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.hz-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hz-top strong { font-size: 20px; font-weight: 800; color: var(--no); }
.hz-top small { font-size: 14px; color: var(--muted); white-space: nowrap; }
.hz { width: 100%; min-height: 60px; padding: 8px 12px; border-radius: 16px; background: var(--no-bg); color: var(--ink); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; font-weight: 700; }
.hz-ic svg { width: 40px; height: 40px; color: var(--no); display: block; }
.hz-ok { min-height: 52px; border-radius: 14px; background: var(--blue); color: var(--on); text-align: center; font-weight: 800; }
.hz-done { margin: 0; color: var(--ok); font-weight: 700; }
.checks { display: flex; flex-direction: column; gap: 12px; }
.check { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.check strong { font-size: 20px; font-weight: 800; }
.yn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.yn button { min-height: 60px; border-radius: 16px; text-align: center; font-size: 19px; font-weight: 800; }
.yn .y { background: var(--ok-bg); color: var(--ok); }
.yn .y.on { background: var(--ok); color: var(--on); }
.yn .n { background: var(--no-bg); color: var(--no); }
.watch { min-height: 56px; border-radius: 16px; border: 2px solid currentColor; text-align: center; font-weight: 700; width: 100%; }
body.stop { background: #A8200F; color: var(--on); }
.stopbox { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; text-align: center; }
.stopbox svg { width: 120px; height: 120px; color: var(--on); }
.stopbox h1 { color: var(--on); font-size: 36px; }
.stopbox p { margin: 0; font-size: 20px; font-weight: 700; }
.rep .tile { min-height: 150px; }
.mine { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px; border-top: 1px solid #EFD9BC; }
.mine b { color: var(--blue); white-space: nowrap; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .art { animation: none; } }
</style>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="overlay" id="overlay" hidden></div>
<script>
/* 그림 아이콘 — 실제 영상을 넣기 전까지 샘플 영상의 화면으로 쓴다 */
const S = 'fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  helmet: `<path ${S} d="M8 42h48M12 42c0-14 8-24 20-24s20 10 20 24"/><path ${S} d="M26 18v12M38 18v12M16 42c2 8 8 12 16 12s14-4 16-12"/>`,
  boot: `<path ${S} d="M20 10h18v26l14 6c4 2 6 5 6 12H14V10z"/><path ${S} d="M14 46h44M26 20h12M26 28h12"/>`,
  vest: `<path ${S} d="M22 8l10 10 10-10 10 8v40H12V16z"/><path ${S} d="M12 34h40M32 18v38"/>`,
  people: `<circle ${S} cx="20" cy="18" r="7"/><circle ${S} cx="44" cy="18" r="7"/><path ${S} d="M8 54c0-14 5-22 12-22s12 8 12 22M32 54c0-14 5-22 12-22s12 8 12 22"/>`,
  box: `<path ${S} d="M10 22l22-12 22 12v22L32 56 10 44z"/><path ${S} d="M10 22l22 12 22-12M32 34v22"/>`,
  lift: `<circle ${S} cx="32" cy="10" r="6"/><path ${S} d="M32 16v16l-10 8 2 16M32 32l10 8-2 16"/><path ${S} d="M14 30h36v10H14z"/>`,
  path: `<path ${S} d="M22 56l6-48M42 56l-6-48"/><path ${S} d="M32 14v6M32 28v8M32 44v8"/>`,
  crane: `<path ${S} d="M16 58V10h38M16 10l-8 10h8M42 10v18"/><path ${S} d="M32 28h20v14H32z"/><path ${S} d="M8 58h16"/>`,
  hole: `<path ${S} d="M6 26h52M6 26l-2 8h56l-2-8"/><ellipse ${S} cx="32" cy="48" rx="18" ry="7"/><path ${S} d="M32 34v6"/>`,
  broom: `<path ${S} d="M46 8L30 34"/><path ${S} d="M22 30l14 8-6 18-20-12z"/><path ${S} d="M18 44l6 4M24 38l6 4"/>`,
  nail: `<path ${S} d="M20 12h24M32 12v36l-4 8"/><path ${S} d="M8 34h48"/>`,
  sort: `<path ${S} d="M12 22h18l-2 32H14zM34 22h18l-2 32H36zM9 22h24M31 22h24"/><path ${S} d="M21 22v-8M43 22v-8"/>`,
  cable: `<path ${S} d="M8 44c10 0 8-24 18-24s8 24 18 24"/><path ${S} d="M44 44h6M50 38h6v12h-6z"/><path ${S} d="M16 56c0-3 2-5 3-7 1 2 3 4 3 7a3 3 0 0 1-6 0z"/>`,
  ladder: `<path ${S} d="M22 6l-6 52M42 6l6 52"/><path ${S} d="M21 14h22M20 24h24M19 34h26M18 44h28"/>`,
  hands: `<path ${S} d="M22 6l-4 52M46 6l4 52"/><path ${S} d="M21 18h26M20 32h29M19 46h31"/><circle ${S} cx="33" cy="26" r="6"/>`,
  ground: `<path ${S} d="M6 54h52"/><path ${S} d="M16 54V24h32v30"/><path ${S} d="M16 34h32M16 44h32"/><path ${S} d="M26 14h12l-6-8z"/>`,
  reach: `<path ${S} d="M16 6l-4 52M32 6l4 52"/><path ${S} d="M15 18h19M14 32h21M13 46h23"/><circle ${S} cx="46" cy="16" r="5"/><path ${S} d="M42 22l-8 18M40 28l14 4"/>`,
  rubber: `<path ${S} d="M20 56V30l-6-12c-1-3 3-5 5-2l5 10V10c0-3 5-3 5 0v14-4c0-3 5-3 5 0v4-2c0-3 5-3 5 0v8-2c0-3 5-3 5 0v12l-2 18z"/>`,
  hose: `<path ${S} d="M6 14h12c14 0 8 26 22 26h8"/><path ${S} d="M48 32h8v16h-8z"/><path ${S} d="M52 50v8"/>`,
  water: `<path ${S} d="M32 8c9 12 16 20 16 30a16 16 0 0 1-32 0c0-10 7-18 16-30z"/><path ${S} d="M24 40c1 5 4 7 8 8"/>`,
  eye: `<path ${S} d="M4 32c8-14 18-20 28-20s20 6 28 20c-8 14-18 20-28 20S12 46 4 32z"/><circle ${S} cx="32" cy="32" r="8"/>`,
  pump: `<path ${S} d="M6 46h30V32h10l10 10v4H6"/><circle ${S} cx="18" cy="50" r="5"/><circle ${S} cx="44" cy="50" r="5"/><path ${S} d="M20 32L34 10l18 8"/>`,
  baton: `<path ${S} d="M40 8l12 8-20 26-10-8z"/><path ${S} d="M22 34l-8 12c-2 3 4 8 6 5l8-11"/>`,
  talk: `<path ${S} d="M8 12h36v24H24l-10 10V36H8z"/><path ${S} d="M50 22h6v22h-6v8l-8-8H30"/>`,
  truck: `<path ${S} d="M6 14h32v30H6zM38 24h12l8 10v10H38z"/><circle ${S} cx="18" cy="48" r="5"/><circle ${S} cx="46" cy="48" r="5"/>`,
  blind: `<path ${S} d="M4 32c8-14 18-20 28-20s20 6 28 20c-8 14-18 20-28 20S12 46 4 32z"/><path ${S} d="M10 54L54 10"/>`,
  phone: `<rect ${S} x="18" y="6" width="28" height="52" rx="4"/><path ${S} d="M28 50h8"/>`,
  health: `<path ${S} d="M32 54C14 42 8 32 8 22a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 10-6 20-24 32z"/><path ${S} d="M18 30h8l4-8 5 14 3-6h8"/>`,
  crack: `<path ${S} d="M8 42h48M12 42c0-14 8-24 20-24s20 10 20 24"/><path ${S} d="M32 18l-4 8 6 4-4 10"/>`

const NO = `<svg class="no" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5"><circle cx="32" cy="32" r="28"/><path d="M12 12l40 40"/></svg>`;
const svg = n => `<svg viewBox="0 0 64 64" aria-hidden="true">${ICON[n]}</svg>`;

/* 영상은 추후 삽입 단계에서 작업별·언어별로 연결한다. 지금은 그림과 자막으로 된 샘플 화면을 쓴다.
   warns 의 세 번째 값 true 는 금지 표시를 겹쳐서 보여준다. */
const TASKS = [
  { id: "gear", name: "보호구 착용", desc: "모든 작업 전 공통", icon: "helmet",
    steps: [["helmet", "안전모를 쓰고 턱끈을 꽉 조입니다."], ["boot", "안전화를 신고 끈을 단단히 묶습니다."], ["vest", "장갑을 끼고, 지급된 조끼를 입습니다."], ["people", "작업 전 안전교육에 참석해 오늘 위험한 곳을 듣습니다."]],
    warns: [["helmet", "턱끈이 풀린 안전모는 쓰러질 때 벗겨집니다.", true], ["crack", "금이 가거나 찌그러진 안전모는 바꿔 달라고 하세요."], ["health", "몸이 안 좋으면 일을 시작하기 전에 관리자에게 말하세요."]] },
  { id: "carry", name: "자재 운반", desc: "시멘트, 벽돌, 합판 나르기", icon: "box",
    steps: [["box", "들기 전에 무게를 확인합니다. 무거우면 2명이 들거나 장비를 씁니다."], ["lift", "허리를 펴고 무릎을 굽혀 다리 힘으로 듭니다."], ["path", "다니는 길에 걸릴 것이 없는지 먼저 봅니다."], ["box", "내려놓을 때도 무릎을 굽히고 천천히 놓습니다."]],
    warns: [["blind", "앞이 안 보일 만큼 높이 들고 걷지 마세요.", true], ["crane", "크레인에 매달린 짐 아래로 절대 지나가지 마세요.", true], ["hole", "바닥 구멍이나 건물 끝 근처에 자재를 쌓지 마세요.", true]] },
  { id: "clean", name: "현장 정리·청소", desc: "폐자재 치우기, 통로 확보", icon: "broom",
    steps: [["broom", "관리자에게 오늘 치울 구역을 확인합니다."], ["nail", "못이 박힌 각목은 못을 빼거나 못이 아래로 가게 모읍니다."], ["sort", "폐기물은 정해진 곳에 종류별로 나눕니다."], ["path", "통로와 계단에 물건이 남지 않게 비웁니다."]],

    <div class="checks">${q.map((s, i) => `<div class="check"><strong>${s}</strong><div class="yn"><button class="y ${answers[i] ? "on" : ""}" data-chk="${i}" data-v="y" aria-pressed="${!!answers[i]}">○ ${x.yes}</button><button class="n" data-chk="${i}" data-v="n">✕ ${x.no}</button></div></div>`).join("")}</div>
    <button class="watch" data-watch>${x.watch}</button>`;
}
function stopView(task) {
  page("stop"); tabs.hidden = true; hush();
  const x = UI3[lang];
  app.innerHTML = `<div class="stopbox"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M21 4h22l17 17v22L43 60H21L4 43V21z" fill="currentColor"/><path d="M20 32h24" stroke="#A8200F" stroke-width="8" stroke-linecap="round"/></svg>
    <h1>${x.stopT}</h1><p>${x.stopB}</p>
    <button class="watch" data-watch>${x.watch}</button><button class="watch" data-go="">${x.other}</button></div>`;
  speak(x.stopT, lang);
}
function picker() {
  stop(); cur = null; page("home"); tabs.hidden = true;
  document.documentElement.lang = lang || "ko";
  app.innerHTML = `<h1>언어 · 语言 · Ngôn ngữ<br>ภาษา · Язык</h1><ul class="langs">${LANGS.map(l => `<li><button class="lang ${l.id === lang ? "on" : ""}" data-lang="${l.id}" lang="${l.id}"><strong>${l.name}</strong><small lang="ko">${l.kr}</small></button></li>`).join("")}</ul>`;
}
function chipRow(label, kind, active, withOff) {
  return `<span>${label}</span><span class="chips">${Object.keys(SUBNAMES).map(k => `<button class="chip ${active === k ? "on" : ""}" data-${kind}="${k}" lang="${k}" aria-pressed="${active === k}">${SUBNAMES[k]}</button>`).join("")}${withOff ? `<button class="chip ${active === "off" ? "on" : ""}" data-${kind}="off" aria-pressed="${active === "off"}">${u2().off}</button>` : ""}</span>`;
}
function detail(task) {
  stop(); cur = task; t = 0; shown = -1; page("work"); showTabs("v");
  app.innerHTML = `<div class="top"><button class="back" data-go="">${u().back}</button>${langBtn()}</div>
    <h1>${task.lname}</h1>
    <div class="player"><div class="screen" id="screen"></div>
      <div class="controls"><button class="pp" id="pp" aria-label="${u().play}"></button>
        <div class="segs">${task.scenes.map((s, i) => `<button class="seg ${s.warn ? "warn" : ""}" data-scene="${i}" aria-label="${s.label}"><i><b></b></i></button>`).join("")}</div>
        <span class="time" id="time"></span></div></div>
    <div class="media" id="media"></div>
    <div class="cards">${task.scenes.map((s, i) => `<button class="card ${s.warn ? "warn" : ""}" data-scene="${i}"><span class="pic">${svg(s.icon)}${s.no ? NO : ""}</span><span class="mark">${s.warn ? (s.no ? "✕" : "!") : "○"}</span><span>${s.cap}</span></button>`).join("")}</div>
    ${note()}`;
  drawMedia(); draw();
  if (wantPlay) play();
  wantPlay = false;
}
function drawMedia() {
  document.getElementById("media").innerHTML = chipRow(u2().sound, "snd", activeSound(), true) + chipRow(u2().caption, "sub", activeSub(), true);
}
function talk() {
  stop(); cur = null; page("work"); showTabs("t");
  const a = PHRASES[lang], b = PHRASES[activeTarget()];
  app.innerHTML = `<div class="top"><h1>${u2().tabT}</h1>${langBtn()}</div>
    <div class="media" id="talkto">${chipRow(u2().to, "tgt", activeTarget(), false)}</div>
    <p class="hint">${u2().tapHint}</p>
    <div class="phrases">${a.map((p, i) => `<button class="phrase ${i === 0 ? "first" : ""}" data-say="${i}"><span><strong>${p}</strong><span lang="${activeTarget()}">${b[i]}</span></span>${SPEAKER}</button>`).join("")}</div>${note()}`;
}
function idx() { return Math.min(cur.scenes.length - 1, Math.floor(t / (DURATION / cur.scenes.length))); }
function draw() {
  if (!cur) return;
  const i = idx(), per = DURATION / cur.scenes.length;
  if (i !== shown) {
    shown = i;
    const s = cur.scenes[i], sub = subText(cur, i);
    document.getElementById("screen").innerHTML = `<span class="badge ${s.warn ? "warn" : ""}">${s.label}</span><span class="sample">${u().sample}</span><div class="art">${svg(s.icon)}${s.no ? NO : ""}</div>${sub ? `<p class="cap" lang="${activeSub()}">${sub}</p>` : ""}`;
    document.querySelectorAll(".card").forEach(r => r.classList.toggle("now", +r.dataset.scene === i));
    if (playing && activeSound() !== "off") speak(textIn(cur, i, activeSound()), activeSound());
  }
  document.querySelectorAll(".seg b").forEach((b, k) => { b.style.width = Math.max(0, Math.min(1, (t - k * per) / per)) * 100 + "%"; });
  document.getElementById("time").textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  const pp = document.getElementById("pp");
  pp.setAttribute("aria-label", playing ? u().pause : u().play);
  pp.innerHTML = playing ? `<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>`;
}
function ended() {
  const b = document.createElement("button"); b.className = "big"; b.id = "again"; b.textContent = u().again;
  document.getElementById("screen").appendChild(b);
}
function tick(now) {
  if (!playing) return;
  t += Math.max(0, (now - last) / 1000); last = now;
  if (t >= DURATION) { t = DURATION; playing = false; hush(); store.add(cur.id); DEMO.add({ type: "done", task: cur.id, lang }); draw(); ended(); return; }
  draw(); timer = requestAnimationFrame(tick);
}
function play() {
  if (t >= DURATION) t = 0;
  shown = -1; playing = true; last = performance.now(); draw();
  timer = requestAnimationFrame(tick);
}
document.addEventListener("click", e => {
  const c = s => e.target.closest(s);
  let el;
  if (c("#closeover")) { overlay.hidden = true; hush(); return; }
  if ((el = c("[data-lang]"))) { lang = el.dataset.lang; langStore.set(lang); subLang = null; subStore.set(null); soundLang = null; keep("sound", null); target = null; keep("target", null); route(); return; }
  if (c("[data-picker]")) { picker(); return; }
  if (c("[data-confirm]")) { keep(hazardKey(), "1"); DEMO.add({ type: "confirm", lang }); home(); return; }
  if ((el = c("[data-report]"))) { DEMO.add({ type: "report", key: el.dataset.report, item: REPORTS[el.dataset.report].ko, lang }); reportView(true); window.scrollTo(0, 0); return; }
  if ((el = c("[data-chk]"))) {
    const task = TASKS.find(x => x.id === location.hash.slice(1));
    if (el.dataset.v === "n") { DEMO.add({ type: "stop", task: task.id, item: CHECKS[task.id].ko[+el.dataset.chk], lang }); stopView(task); return; }
    answers[+el.dataset.chk] = true;
    if (CHECKS[task.id][lang].every((_, i) => answers[i])) { skipGate = true; wantPlay = true; route(); return; }
    checkView(task); return;
  }
  if (c("[data-watch]")) { skipGate = true; wantPlay = true; route(); return; }
  if ((el = c("[data-go]"))) {
    wantPlay = !!el.dataset.go && el.dataset.go !== "talk" && el.dataset.go !== "report";
    if (location.hash.slice(1) === el.dataset.go) route(); else location.hash = el.dataset.go;
    return;
  }
  if ((el = c("[data-say]"))) {
    const p = PHRASES[activeTarget()][+el.dataset.say];
    overlay.innerHTML = `<p lang="${activeTarget()}">${p}</p><button id="closeover">${u2().close}</button>`;
    overlay.hidden = false; speak(p, activeTarget());
    return;
  }
  if ((el = c("[data-tgt]"))) { target = el.dataset.tgt; keep("target", target); talk(); return; }
  if ((el = c("[data-sub]")) && cur) {
    subLang = el.dataset.sub; subStore.set(subLang); drawMedia(); shown = -1;
    const said = playing; playing = false; draw(); playing = said; if (t >= DURATION) ended();
    return;
  }
  if ((el = c("[data-snd]")) && cur) {
    soundLang = el.dataset.snd; keep("sound", soundLang); drawMedia(); hush();
    if (playing && soundLang !== "off") speak(textIn(cur, idx(), activeSound()), activeSound());
    return;
  }
  if ((el = c("[data-scene]")) && cur) {
    t = +el.dataset.scene * (DURATION / cur.scenes.length) + 0.01;
    stop(); play();
    if (el.classList.contains("card")) document.querySelector(".player").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (c("#again")) { t = 0; play(); return; }
  if (c("#pp") && cur) { if (playing) { stop(); draw(); } else play(); }
});
function route() {
  overlay.hidden = true;
  if (!lang) { picker(); return; }
  localize();
  const h = location.hash.slice(1);
  if (h === "talk") { talk(); return; }
  if (h === "report") { reportView(false); return; }
  const task = TASKS.find(x => x.id === h);
  if (task && CHECKS[task.id] && wantPlay && !skipGate) { answers = []; wantPlay = false; checkView(task); return; }
  skipGate = false;
  task ? detail(task) : home();
}
addEventListener("hashchange", route);
addEventListener("storage", e => {
  const h = location.hash.slice(1);
  if (e.key === "demo-hazards" && !h) home();
  if (e.key === "demo-seed-status" && h === "report") reportView(false);
});
route();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
