<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작업 안내">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>오늘의 작업 안내</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700;900&display=swap">
<style>
/* Layout: 한 손으로 쓰는 세로 한 줄 앱. 목록 → 영상 + 작업 순서 + 주의사항.
   햇빛 아래에서 잘 보이도록 밝은 단일 테마로 고정하고, 현장 안전표지의 색 체계를 그대로 쓴다. */
:root {
  --bg: #f3f2ec;
  --surface: #ffffff;
  --ink: #17181a;
  --muted: #595b60;
  --line: #d6d5cc;
  --safety: #ffc800;
  --danger: #c8200f;
  --danger-tint: #fdecea;
  --go: #0b7a45;
  --stage: #17181a;
  --on-stage: #ffffff;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--body); word-break: keep-all; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--danger); outline-offset: 2px; }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stripe { height: 12px; background: repeating-linear-gradient(-45deg, var(--safety) 0 18px, var(--ink) 18px 36px); }
header.top { background: var(--safety); }
header.top .wrap { padding-block: 22px 20px; }
h1 { font: 400 clamp(32px, 9vw, 44px)/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { margin: 6px 0 0; font-weight: 500; }
main .wrap { padding-block: 18px 32px; display: flex; flex-direction: column; gap: 22px; }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.task { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; min-height: 88px; padding: 12px 14px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; }
.task:hover { background: var(--safety); }
.task .ic { width: 64px; height: 64px; display: grid; place-items: center; background: var(--safety); border-radius: 4px; }
.task:hover .ic { background: var(--surface); }
.task .ic svg { width: 46px; height: 46px; }
.task strong { display: block; font-size: 20px; font-weight: 900; line-height: 1.3; }
.task small { display: block; font-size: 15px; color: var(--muted); }
.task:hover small { color: var(--ink); }
.task .len { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.task .seen { display: block; color: var(--go); font-size: 14px; font-weight: 700; text-align: right; }

.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; }
.player { background: var(--stage); color: var(--on-stage); border-radius: 6px; overflow: hidden; }
.screen { position: relative; aspect-ratio: 16 / 10; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 44px 16px 12px; text-align: center; }
.screen video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
.badge { position: absolute; top: 12px; left: 12px; padding: 2px 10px; border-radius: 3px; font-weight: 900; font-size: 15px; background: var(--safety); color: var(--ink); }
.badge.warn { background: var(--danger); color: var(--on-stage); }
.sample { position: absolute; top: 14px; right: 12px; font-size: 13px; opacity: .75; }
.art { position: relative; flex: none; width: clamp(68px, 20vw, 130px); height: clamp(68px, 20vw, 130px); color: var(--on-stage); animation: pop .5s ease-out both, bob 2.4s ease-in-out .5s infinite; }
.paused .art { animation-play-state: paused; }
.art svg { width: 100%; height: 100%; }
.art .no { position: absolute; inset: -6%; color: var(--danger); }
.cap { margin: 0; font-size: clamp(18px, 5vw, 23px); font-weight: 700; line-height: 1.35; max-width: 26em; text-wrap: balance; }
.big { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(23,24,26,.62); width: 100%; font: 400 24px var(--display); text-align: center; color: var(--on-stage); }
.controls { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px 10px 8px; }
.pp { width: 56px; height: 48px; display: grid; place-items: center; }
.pp svg { width: 28px; height: 28px; fill: var(--on-stage); }
.segs { display: flex; gap: 3px; height: 44px; align-items: center; }
.seg { flex: 1; height: 44px; display: flex; align-items: center; min-width: 0; }
.seg i { display: block; width: 100%; height: 8px; background: #55575c; position: relative; overflow: hidden; }
.seg i b { position: absolute; inset: 0 auto 0 0; background: var(--safety); }
.seg.warn i b { background: #ff6a55; }
.time { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; }

h2 { font: 400 24px/1.25 var(--display); margin: 0 0 8px; }
section > p.hint { margin: -4px 0 10px; color: var(--muted); font-size: 15px; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; min-height: 60px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.row .n { width: 40px; height: 40px; display: grid; place-items: center; background: var(--ink); color: var(--safety); font: 400 21px var(--display); border-radius: 50%; }
.row.warn { background: var(--danger-tint); border-color: var(--danger); }
.row.warn .n { background: var(--danger); color: var(--on-stage); border-radius: 4px; }
.row.on { outline: 3px solid var(--ink); outline-offset: -1px; }
.row span.t { font-weight: 500; align-self: center; min-width: 0; }

.note { font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.note p { margin: 0 0 6px; }
.note strong { color: var(--ink); }
html:lang(zh) { --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
html:lang(vi), html:lang(ru) { --body: "Noto Sans", Roboto, Arial, sans-serif; }
html:lang(th) { --body: "Noto Sans Thai", Thonburi, Tahoma, sans-serif; }
html:not(:lang(ko)) body { word-break: normal; overflow-wrap: anywhere; }
html:not(:lang(ko)) h1, html:not(:lang(ko)) h2, html:not(:lang(ko)) .big, html:not(:lang(ko)) .row .n { font-family: var(--body); font-weight: 900; }
.toprow { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.langbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 4px; font-weight: 700; font-size: 16px; }
.langbtn svg { width: 22px; height: 22px; }
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lang { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 10px 18px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; }
.lang:hover, .lang.on { background: var(--safety); }
.lang strong { font-size: 24px; font-weight: 900; }
.lang small { font-size: 15px; color: var(--ink); font-family: "Noto Sans KR", sans-serif; }
.cap { font-family: "Noto Sans KR", "Noto Sans SC", "Noto Sans Thai", "Noto Sans", sans-serif; word-break: normal; overflow-wrap: anywhere; }
.cap:lang(ko) { word-break: keep-all; }
.cap:lang(zh) { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
.cap:lang(th) { font-family: "Noto Sans Thai", Thonburi, Tahoma, sans-serif; }
.cap:lang(vi), .cap:lang(ru) { font-family: "Noto Sans", Roboto, Arial, sans-serif; }
.subs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid #3a3c40; }
.subs > span { font-weight: 700; font-size: 15px; margin-right: 4px; }
.chip { min-height: 40px; padding: 0 12px; border: 1px solid #8a8c90; border-radius: 4px; font-size: 15px; font-weight: 500; color: var(--on-stage); }
.chip.on { background: var(--safety); border-color: var(--safety); color: var(--ink); font-weight: 700; }
@keyframes pop { from { transform: scale(.8); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@keyframes bob { 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .art { animation: none; } }
</style>

<div class="stripe"></div>
<header class="top"><div class="wrap">
  <div class="toprow"><button class="langbtn" id="langbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9z"/></svg><span id="langname">한국어</span></button></div>
  <h1 id="head">오늘 무슨 일을 하세요?</h1>
  <p class="sub" id="subhead">내 작업을 누르면 1분 영상이 바로 나옵니다.</p>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script>
/* 그림 아이콘 — 실제 영상을 넣기 전까지 샘플 영상의 화면으로 쓴다 */
const S = 'fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {

  baton: `<path ${S} d="M40 8l12 8-20 26-10-8z"/><path ${S} d="M22 34l-8 12c-2 3 4 8 6 5l8-11"/>`,
  talk: `<path ${S} d="M8 12h36v24H24l-10 10V36H8z"/><path ${S} d="M50 22h6v22h-6v8l-8-8H30"/>`,
  truck: `<path ${S} d="M6 14h32v30H6zM38 24h12l8 10v10H38z"/><circle ${S} cx="18" cy="48" r="5"/><circle ${S} cx="46" cy="48" r="5"/>`,
  blind: `<path ${S} d="M4 32c8-14 18-20 28-20s20 6 28 20c-8 14-18 20-28 20S12 46 4 32z"/><path ${S} d="M10 54L54 10"/>`,
  phone: `<rect ${S} x="18" y="6" width="28" height="52" rx="4"/><path ${S} d="M28 50h8"/>`,
  health: `<path ${S} d="M32 54C14 42 8 32 8 22a12 12 0 0 1 24-4 12 12 0 0 1 24 4c0 10-6 20-24 32z"/><path ${S} d="M18 30h8l4-8 5 14 3-6h8"/>`,
  crack: `<path ${S} d="M8 42h48M12 42c0-14 8-24 20-24s20 10 20 24"/><path ${S} d="M32 18l-4 8 6 4-4 10"/>`

const NO = `<svg class="no" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5"><circle cx="32" cy="32" r="28"/><path d="M12 12l40 40"/></svg>`;
const svg = n => `<svg viewBox="0 0 64 64" aria-hidden="true">${ICON[n]}</svg>`;

/* 영상은 추후 삽입 단계에서 작업별·언어별로 연결한다. 지금은 그림과 자막으로 된 샘플 화면을 쓴다.
   warns 의 세 번째 값 true 는 금지 표시를 겹쳐서 보여준다. */

  { id: "gear", name: "보호구 착용", desc: "모든 작업 전 공통", icon: "helmet",
    steps: [["helmet", "안전모를 쓰고 턱끈을 꽉 조입니다."], ["boot", "안전화를 신고 끈을 단단히 묶습니다."], ["vest", "장갑을 끼고, 지급된 조끼를 입습니다."], ["people", "작업 전 안전교육에 참석해 오늘 위험한 곳을 듣습니다."]],

  { id: "carry", name: "자재 운반", desc: "시멘트, 벽돌, 합판 나르기", icon: "box",
    steps: [["box", "들기 전에 무게를 확인합니다. 무거우면 2명이 들거나 장비를 씁니다."], ["lift", "허리를 펴고 무릎을 굽혀 다리 힘으로 듭니다."], ["path", "다니는 길에 걸릴 것이 없는지 먼저 봅니다."], ["box", "내려놓을 때도 무릎을 굽히고 천천히 놓습니다."]],
    warns: [["blind", "앞이 안 보일 만큼 높이 들고 걷지 마세요.", true], ["crane", "크레인에 매달린 짐 아래로 절대 지나가지 마세요.", true], ["hole", "바닥 구멍이나 건물 끝 근처에 자재를 쌓지 마세요.", true]] },

  { id: "ladder", name: "사다리 작업", desc: "오르내리기, 높은 곳 작업", icon: "ladder",
    steps: [["ladder", "쓰기 전에 발판과 다리에 부러진 곳이 없는지 봅니다."], ["ground", "평평하고 단단한 바닥에 놓고 움직이지 않게 고정합니다."], ["hands", "두 손으로 잡고 얼굴을 사다리 쪽으로 향해 오르내립니다."], ["box", "공구는 손에 들지 말고 가방에 넣거나 줄로 올립니다."]],

    signal: ["คนให้สัญญาณเครื่องจักร", "นำทางรถขุด รถบรรทุก", ["สวมเสื้อกั๊ก เตรียมกระบองสัญญาณและนกหวีด", "ตกลงวิธีให้สัญญาณกับคนขับไว้ล่วงหน้า", "ยืนในจุดที่คนขับมองเห็นคุณ", "กันไม่ให้คนเข้าใกล้เครื่องจักรและนำทาง"], ["อย่ายืนด้านหลังหรือด้านข้างของเครื่องจักรที่กำลังเคลื่อนที่", "ถ้าคุณมองไม่เห็นคนขับ คนขับก็มองไม่เห็นคุณ ให้สัญญาณหยุดทันที", "อย่าดูโทรศัพท์ขณะให้สัญญาณ"]]
  },
  ru: {
    gear: ["Средства защиты", "Перед любой работой", ["Наденьте каску и туго затяните подбородочный ремень.", "Наденьте защитную обувь и крепко завяжите шнурки.", "Наденьте перчатки и выданный жилет.", "Пройдите инструктаж перед работой и узнайте об опасных местах на сегодня."], ["Каска с расстёгнутым ремнём слетит при падении.", "Если каска треснула или помята, попросите заменить её.", "Если плохо себя чувствуете, скажите руководителю до начала работы."]],
    carry: ["Перенос материалов", "Цемент, кирпич, фанера", ["Перед подъёмом проверьте вес. Если тяжело, несите вдвоём или используйте технику.", "Держите спину прямо, согните колени и поднимайте за счёт ног.", "Сначала проверьте, нет ли препятствий на пути.", "Опуская груз, тоже сгибайте колени и ставьте его медленно."], ["Не несите груз так высоко, чтобы он закрывал обзор.", "Никогда не проходите под грузом, висящим на кране.", "Не складывайте материалы рядом с проёмами в полу и краем здания."]],
    clean: ["Уборка площадки", "Вынос отходов, свободные проходы", ["Уточните у руководителя, какой участок убирать сегодня.", "Из брусков с гвоздями вытащите гвозди или сложите их остриём вниз.", "Сортируйте отходы и относите их в отведённое место.", "Освободите проходы и лестницы от предметов."], ["Не бросайте отходы вниз с высоты.", "Не убирайте щит, закрывающий проём в полу, даже если он похож на мусор.", "Не трогайте провода в мокрых местах, сообщите руководителю."]],
    ladder: ["Работа на лестнице", "Подъём, спуск, работа на высоте", ["Перед работой проверьте, нет ли поломок на ступенях и опорах.", "Поставьте лестницу на ровное твёрдое основание и закрепите её.", "Поднимайтесь и спускайтесь лицом к лестнице, держась двумя руками.", "Не держите инструмент в руках: положите в сумку или поднимите на верёвке."], ["Не вставайте на самую верхнюю ступень.", "Не тянитесь в сторону: спуститесь и переставьте лестницу.", "Не работайте в одиночку: пусть коллега держит лестницу снизу."]],
    concrete: ["Помощь при бетонировании", "Удержание шланга, выравнивание", ["Наденьте резиновые перчатки, сапоги и защитные очки.", "Уточните у бригадира своё место и сигналы для автобетононасоса.", "Держите шланг вместе с другими: он может резко дёрнуться.", "После работы тщательно смойте бетон с оборудования и с тела."], ["Бетон на коже вызывает ожог. Сразу смойте его водой.", "При попадании в глаза сразу промойте большим количеством воды и обратитесь в больницу.", "Не стойте под стрелой автобетононасоса."]],
    signal: ["Сигнальщик техники", "Экскаваторы, грузовики", ["Наденьте жилет, возьмите сигнальный жезл и свисток.", "Заранее согласуйте сигналы с водителем.", "Встаньте там, где водитель вас видит.", "Не допускайте людей к технике и направляйте её движение."], ["Не стойте прямо за движущейся техникой или рядом с ней.", "Если вы не видите водителя, он не видит вас. Сразу подайте сигнал остановки.", "Не смотрите в телефон во время подачи сигналов."]]
  }
};
/* 자막: 앱 언어와 따로 고를 수 있다. 고르기 전에는 앱 언어를 따라간다. */
const SUBUI = {
  ko: ["자막", "끄기"], zh: ["字幕", "关闭"], vi: ["Phụ đề", "Tắt"], th: ["คำบรรยาย", "ปิด"], ru: ["Субтитры", "Выкл."]
};
const SUBNAMES = { ko: "한국어", zh: "中文", vi: "Tiếng Việt", th: "ไทย", ru: "Русский" };
const subStore = {
  get() { try { const v = localStorage.getItem("sub"); return v === "off" || UI[v] ? v : null; } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem("sub", v) : localStorage.removeItem("sub"); } catch (e) {} }
};
let subLang = subStore.get();
const activeSub = () => subLang || lang || "ko";
function subText(task, i) {
  const sl = activeSub();
  if (sl === "off") return "";
  const o = (I18N[sl] || {})[task.id];
  const all = o ? [...o[2], ...o[3]] : [...task.steps, ...task.warns].map(s => s[1]);
  return all[i];
}
function subBar() {
  const a = activeSub(), [label, off] = SUBUI[lang || "ko"];
  return `<div class="subs" role="group" aria-label="${label}"><span>${label}</span>${
    Object.keys(SUBNAMES).map(k => `<button class="chip ${a === k ? "on" : ""}" data-sub="${k}" lang="${k}" aria-pressed="${a === k}">${SUBNAMES[k]}</button>`).join("")
  }<button class="chip ${a === "off" ? "on" : ""}" data-sub="off" aria-pressed="${a === "off"}">${off}</button></div>`;
}
const langStore = {
  get() { try { const v = localStorage.getItem("lang"); return UI[v] ? v : null; } catch (e) { return null; } },
  set(v) { try { localStorage.setItem("lang", v); } catch (e) {} }
};
let lang = langStore.get();
const u = () => UI[lang || "ko"];
function localize() {
  document.documentElement.lang = lang || "ko";
  document.getElementById("langname").textContent = LANGS.find(l => l.id === (lang || "ko")).name;
  TASKS.forEach(t => {
    const o = (I18N[lang] || {})[t.id];
    t.lname = o ? o[0] : t.name;
    t.ldesc = o ? o[1] : t.desc;
    t.scenes = [
      ...t.steps.map((s, i) => ({ icon: s[0], cap: o ? o[2][i] : s[1], label: u().step(i + 1), warn: false, no: false })),
      ...t.warns.map((s, i) => ({ icon: s[0], cap: o ? o[3][i] : s[1], label: u().warn, warn: true, no: !!s[2] }))
    ];
  });
}

const DURATION = 60;
const app = document.getElementById("app");
const store = {
  get() { try { return JSON.parse(localStorage.getItem("seen") || "[]"); } catch (e) { return []; } },
  add(id) { try { const s = new Set(store.get()); s.add(id); localStorage.setItem("seen", JSON.stringify([...s])); } catch (e) {} }
};
let timer = null, cur = null, t = 0, playing = false, last = 0, shown = -1, wantPlay = false;

function stop() { if (timer) cancelAnimationFrame(timer); timer = null; playing = false; }
function fmt(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function home() {
  stop(); cur = null;
  document.getElementById("langbtn").hidden = false;
  document.getElementById("head").textContent = u().head;
  document.getElementById("subhead").textContent = u().sub;
  const seen = store.get();
  app.innerHTML = `<ul class="tasks">${TASKS.map(x => `<li><button class="task" data-go="${x.id}">
      <span class="ic">${svg(x.icon)}</span>
      <span style="min-width:0"><strong>${x.lname}</strong><small>${x.ldesc}</small></span>
      <span class="len">▶ ${u().len}${seen.includes(x.id) ? `<span class="seen">${u().seen}</span>` : ""}</span>
    </button></li>`).join("")}</ul>${note()}`;
}
function note() {
  return `<div class="note">
    <p><strong>${u().n1}</strong> ${u().n1b}</p>
    <p>${u().n2}</p>
    <p>${u().n3}</p></div>`;
}
function picker() {
  stop(); cur = null;
  document.documentElement.lang = lang || "ko";
  document.getElementById("langbtn").hidden = true;
  document.getElementById("head").textContent = "언어 · 语言 · Ngôn ngữ";
  document.getElementById("subhead").textContent = "ภาษา · Язык";
  app.innerHTML = `<ul class="langs">${LANGS.map(l => `<li><button class="lang ${l.id === lang ? "on" : ""}" data-lang="${l.id}" lang="${l.id}"><strong>${l.name}</strong><small>${l.kr}</small></button></li>`).join("")}</ul>`;
}
function detail(task) {
  stop(); cur = task; t = 0; shown = -1;
  document.getElementById("langbtn").hidden = false;
  document.getElementById("head").textContent = task.lname;
  document.getElementById("subhead").textContent = task.ldesc;
  const per = i => `data-scene="${i}"`;
  const n = task.steps.length;
  app.innerHTML = `<div><button class="back" data-go="">${u().back}</button></div>
    <div class="player" id="player">
      <div class="screen" id="screen"></div>
      <div class="controls">
        <button class="pp" id="pp" aria-label="재생"></button>
        <div class="segs">${task.scenes.map((s, i) => `<button class="seg ${s.warn ? "warn" : ""}" ${per(i)} aria-label="${s.label}"><i><b></b></i></button>`).join("")}</div>
        <span class="time" id="time"></span>
      </div>
      <div id="subbar">${subBar()}</div>
    </div>
    <section><h2>${u().doit}</h2><p class="hint">${u().hint}</p>
      <ol class="rows">${task.scenes.slice(0, n).map((s, i) => `<li><button class="row" ${per(i)}><span class="n">${i + 1}</span><span class="t">${s.cap}</span></button></li>`).join("")}</ol></section>
    <section><h2>${u().careful}</h2>
      <ul class="rows">${task.scenes.slice(n).map((s, i) => `<li><button class="row warn" ${per(i + n)}><span class="n">!</span><span class="t">${s.cap}</span></button></li>`).join("")}</ul></section>
    ${note()}`;
  draw();
  if (wantPlay) play();
  wantPlay = false;
}
function idx() { return Math.min(cur.scenes.length - 1, Math.floor(t / (DURATION / cur.scenes.length))); }
function draw() {
  if (!cur) return;
  const i = idx(), per = DURATION / cur.scenes.length;
  if (i !== shown) {
    shown = i;
    const s = cur.scenes[i];
    document.getElementById("screen").innerHTML =
      `<span class="badge ${s.warn ? "warn" : ""}">${s.label}</span><span class="sample">${u().sample}</span>
       <div class="art">${svg(s.icon)}${s.no ? NO : ""}</div>${subText(cur, i) ? `<p class="cap" lang="${activeSub()}">${subText(cur, i)}</p>` : ""}`;
    document.querySelectorAll(".row").forEach(r => r.classList.toggle("on", +r.dataset.scene === i));
  }
  document.querySelectorAll(".seg b").forEach((b, k) => {
    const f = Math.max(0, Math.min(1, (t - k * per) / per));
    b.style.width = (f * 100) + "%";
  });
  document.getElementById("time").textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  const pp = document.getElementById("pp");
  pp.setAttribute("aria-label", playing ? u().pause : u().play);
  pp.innerHTML = playing ? `<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>`;
  document.getElementById("player").classList.toggle("paused", !playing);
}
function tick(now) {
  if (!playing) return;
  t += (now - last) / 1000; last = now;
  if (t >= DURATION) {
    t = DURATION; playing = false; store.add(cur.id); draw();
    const big = document.createElement("button");
    big.className = "big"; big.id = "again"; big.textContent = u().again;
    document.getElementById("screen").appendChild(big);
    return;
  }
  draw(); timer = requestAnimationFrame(tick);
}
function play() {
  if (t >= DURATION) { t = 0; shown = -1; }
  playing = true; last = performance.now(); draw();
  timer = requestAnimationFrame(tick);
}
function pause() { stop(); draw(); }

document.getElementById("langbtn").addEventListener("click", () => { picker(); window.scrollTo(0, 0); });
app.addEventListener("click", e => {
  const pick = e.target.closest("[data-lang]");
  if (pick) { lang = pick.dataset.lang; langStore.set(lang); subLang = null; subStore.set(null); route(); window.scrollTo(0, 0); return; }
  const sub = e.target.closest("[data-sub]");
  if (sub && cur) {
    subLang = sub.dataset.sub; subStore.set(subLang);
    document.getElementById("subbar").innerHTML = subBar();
    shown = -1; draw();
    const again = t >= DURATION;
    if (again) { const big = document.createElement("button"); big.className = "big"; big.id = "again"; big.textContent = u().again; document.getElementById("screen").appendChild(big); }
    return;
  }
  const go = e.target.closest("[data-go]");
  if (go) {
    wantPlay = !!go.dataset.go;
    if (location.hash.slice(1) === go.dataset.go) route(); else location.hash = go.dataset.go;
    window.scrollTo(0, 0);
    return;
  }
  const sc = e.target.closest("[data-scene]");
  if (sc && cur) {
    t = +sc.dataset.scene * (DURATION / cur.scenes.length) + 0.01; shown = -1;
    stop(); play();
    if (sc.classList.contains("row")) document.getElementById("player").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (e.target.closest("#again")) { t = 0; shown = -1; play(); return; }
  if (e.target.closest("#pp")) { playing ? pause() : play(); }
});
function route() {
  if (!lang) { picker(); return; }
  localize();
  const task = TASKS.find(x => x.id === location.hash.slice(1));
  task ? detail(task) : home();
}
addEventListener("hashchange", route);
route();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
